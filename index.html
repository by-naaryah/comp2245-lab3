<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
  <script src="script.js"></script>

</head>
<body>
  <main class="game">
    <h1>Memory</h1>

    <p id="status" role="status">Turn over two cards to find a matching pair.</p>

    <p class="moves">Moves: <span id="moves">0</span></p>

    <div id="board" aria-label="Cards"></div>

    <button type="button" id="new-game" class="btn">New game</button>
  </main>
  <div class="container">
  <h1>Welcome to COMP2245 Lab 3</h1>
  <p>Please fill out the form below:</p>

  <form id="labForm">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <button type="submit">Submit</button>
  </form>

  <p id="message"></p>
</div>

</body>
</html>
